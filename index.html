<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>पढ़ाई साथी - कक्षा 1 से 10</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f7f6; color: #333; }
        header { background: #4A90E2; color: white; padding: 15px; text-align: center; font-size: 24px; font-weight: bold; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        .section-title { margin: 15px 0 10px; font-size: 18px; color: #555; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
        .card { background: white; border-radius: 8px; padding: 15px; text-align: center; cursor: pointer; border: 2px solid #e0e0e0; transition: 0.2s; }
        .card:hover, .card.selected { border-color: #4A90E2; background: #eef5fc; }
        .content-area { background: white; margin-top: 20px; padding: 20px; border-radius: 8px; min-height: 250px; border: 1px solid #ddd; }
        .lesson-card { background: #f9f9f9; border-left: 4px solid #4A90E2; padding: 12px; margin-bottom: 10px; border-radius: 4px; }
        .lesson-card h4 { color: #2c3e50; margin-bottom: 4px; }
    </style>
</head>
<body>

<header>📚 पढ़ाई साथी (Study Companion)</header>

<div class="container">
    <!-- कक्षा चुनाव -->
    <div class="section-title">1. अपनी कक्षा चुनें (Select Class):</div>
    <div class="grid" id="class-grid"></div>

    <!-- विषय चुनाव -->
    <div class="section-title">2. विषय चुनें (Select Subject):</div>
    <div class="grid" id="subject-grid"></div>

    <!-- पढ़ाई सामग्री -->
    <div class="content-area">
        <h3 id="topic-title">विषय और कक्षा का चयन करें</h3>
        <hr style="margin: 10px 0;"><br>
        <div id="learning-content">कृपया ऊपर दी गई कक्षाओं में से चुनाव करें।</div>
    </div>
</div>

<script>
    // डेटाबेस (Database Structure)
    const db = {
        1: {
            "हिंदी": [
                { title: "अ वर्णमाला", desc: "अ से अनार (Anar), आ से आम (Mango), इ से इमली (Tamarind)" },
                { title: "क वर्णमाला", desc: "क से कबूतर (Pigeon), ख से खरगोश (Rabbit), ग से गमला" }
            ],
            "इंग्लिश": [
                { title: "Alphabets (A-M)", desc: "A for Apple 🍎, B for Ball ⚽, C for Cat 🐱, D for Dog 🐶" },
                { title: "Alphabets (N-Z)", desc: "N for Nest 🪹, O for Orange 🍊, P for Parrot 🦜" }
            ],
            "गणित": [
                { title: "गिनती (Counting 1-10)", desc: "1 (एक), 2 (दो), 3 (तीन), 4 (चार), 5 (पाँच)" },
                { title: "जोड़ (Basic Addition)", desc: "1 + 1 = 2,  2 + 1 = 3" }
            ],
            "विज्ञान": [
                { title: "हमारे शरीर के अंग", desc: "Eye (आंख), Ear (कान), Nose (नाक), Hand (हाथ)" }
            ]
        },
        5: {
            "हिंदी": [
                { title: "व्याकरण - संज्ञा", desc: "किसी व्यक्ति, वस्तु या स्थान के नाम को संज्ञा कहते हैं। उदाहरण: राम, दिल्ली, किताब।" }
            ],
            "इंग्लिश": [
                { title: "Nouns & Types", desc: "A noun is a name of a person, place, or thing. Types: Proper, Common, Collective." }
            ],
            "गणित": [
                { title: "भिन्न (Fractions)", desc: "1/2 (आधा), 1/4 (चौथाई), 3/4 (तीन चौथाई)" }
            ],
            "विज्ञान": [
                { title: "पौधों में प्रकाश संश्लेषण", desc: "पौधे सूर्य के प्रकाश और पानी से अपना भोजन बनाते हैं।" }
            ]
        },
        10: {
            "हिंदी": [
                { title: "रस और अलंकार", desc: "काव्य की शोभा बढ़ाने वाले तत्वों को अलंकार कहते हैं। (अनुप्रास, रूपक, यमक)" }
            ],
            "इंग्लिश": [
                { title: "Tenses & Grammar", desc: "Present Continuous: Subject + is/am/are + Verb(ing)." }
            ],
            "गणित": [
                { title: "द्विघात समीकरण (Quadratic Equations)", desc: "मानक रूप: ax² + bx + c = 0" }
            ],
            "विज्ञान": [
                { title: "प्रकाश का परावर्तन (Reflection of Light)", desc: "आपतन कोण (Angle of Incidence) = परावर्तन कोण (Angle of Reflection)।" }
            ]
        }
    };

    let selectedClass = 1;
    let selectedSubject = "हिंदी";

    // कक्षा बटन बनाना (1 से 10)
    const classGrid = document.getElementById("class-grid");
    for (let i = 1; i <= 10; i++) {
        const btn = document.createElement("div");
        btn.className = `card ${i === 1 ? 'selected' : ''}`;
        btn.innerText = `कक्षा ${i}`;
        btn.onclick = () => selectClass(i, btn);
        classGrid.appendChild(btn);
    }

    // विषय बटन बनाना
    const subjects = ["हिंदी", "इंग्लिश", "गणित", "विज्ञान"];
    const subjectGrid = document.getElementById("subject-grid");
    subjects.forEach((sub, index) => {
        const btn = document.createElement("div");
        btn.className = `card ${index === 0 ? 'selected' : ''}`;
        btn.innerText = sub;
        btn.onclick = () => selectSubject(sub, btn);
        subjectGrid.appendChild(btn);
    });

    function selectClass(c, element) {
        document.querySelectorAll("#class-grid .card").forEach(el => el.classList.remove("selected"));
        element.classList.add("selected");
        selectedClass = c;
        renderContent();
    }

    function selectSubject(s, element) {
        document.querySelectorAll("#subject-grid .card").forEach(el => el.classList.remove("selected"));
        element.classList.add("selected");
        selectedSubject = s;
        renderContent();
    }

    function renderContent() {
        const titleArea = document.getElementById("topic-title");
        const contentArea = document.getElementById("learning-content");
        
        titleArea.innerText = `कक्षा ${selectedClass} - ${selectedSubject}`;
        contentArea.innerHTML = "";

        const classData = db[selectedClass];
        if (classData && classData[selectedSubject]) {
            classData[selectedSubject].forEach(item => {
                const box = document.createElement("div");
                box.className = "lesson-card";
                box.innerHTML = `<h4>${item.title}</h4><p>${item.desc}</p>`;
                contentArea.appendChild(box);
            });
        } else {
            contentArea.innerHTML = `<p style="color: #777;">कक्षा ${selectedClass} के ${selectedSubject} विषय का डेटा जोड़ने के लिए 'db' ऑब्जेक्ट में सामग्री जोड़ें।</p>`;
        }
    }

    // शुरुआती लोड
    renderContent();
</script>

</body>
</html>
